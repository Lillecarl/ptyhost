# ptyhost depends on nothing of the collection, so it stands
# first-party alone. Named so the grouping never follows PYTHONPATH:
# measured on pymux, an installed sibling sorts one way in the dev
# shell and the other in the sandbox.
known-first-party = ["ptyhost"]
