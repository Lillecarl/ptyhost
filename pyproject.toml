# What ptyhost is and what it needs. `setup.py` used to say this, and a build
# read it by running it. Nix reads this file instead, at evaluation time, so
# the dependency list here is the one the package is built from and there is
# no second copy in a `.nix` file to fall out of step. Lillecarl/pymux#319.
[project]
name = "ptyhost"
version = "0.1"
description = "Run a program on a pty: start it, size it, pump its bytes."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Almost nothing. Running a program on a pty needs the standard library
# and the operating system, and that is the point of this package: a
# widget that depends on it takes on no toolkit and no parser.
# Lillecarl/pymux#85.
#
# Windows has no pty, so it needs a library to pretend. The marker is
# what `setup.py` spelled as an `if` around an append, and a marker is
# read without running anything.
dependencies = [
    "yawinpty; sys_platform == 'win32'",
]

[project.optional-dependencies]
# What a check installs, beside what ptyhost itself needs. anyio carries
# the pytest plugin that runs a coroutine test; without it pytest fails
# one with "async def functions are not natively supported", and what
# this package does is asynchronous throughout.
test = [
    "pytest",
    "anyio",
    # The remote backend. `ptyhost.backends.asyncssh` imports it at the
    # top, and `backends/__init__.py` imports only `base`, so nothing
    # pulls it in at run time -- a person who wants a remote pane
    # installs it. A test that drives that backend has to have it.
    "asyncssh",
]

[project.urls]
Homepage = "https://github.com/Lillecarl/ptyhost"

[project.scripts]
# A recorder, not a test. A fault that only a real program shows, on the
# machine of the person who hit it, can only reach a check by being
# recorded there first, so the recorder has to run anywhere.
ptyhost-record = "ptyhost.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptyhost"]

[tool.pytest.ini_options]
# Run a coroutine test, with no mark on it.
#
# Without this, pytest fails an "async def test" with "async def
# functions are not natively supported". So the cost is loud, and it is
# that no async test in this repository can run at all.
#
# `testSources` in `default.nix` carries this file to the suite. A
# setting the check cannot read is a setting that holds by hand and not
# where it counts.
anyio_mode = "auto"

[tool.ruff]
# Mirror of the `ruff.toml` beside the umbrella: the build sandbox
# sees only this tree, so discovery from a file under it must end
# here. Keep the two in step; the why lives up there.
#
# The floor is 3.14, like the umbrella's.
target-version = "py314"
# Pinned: a ruff upgrade must never silently reflow the tree.
line-length = 120

[tool.ruff.lint]
# Mirror of the umbrella `ruff.toml`, rule for rule: the build
# sandbox sees only this tree, so discovery from a file under it
# must end here. Change the rules in both places. Every rule here
# autofixes cleanly through the editor pipeline, and the gate below
# holds what the pipeline leaves behind.
#
# UP037 unquotes an annotation once the future import makes it lazy.
# I001 sorts the imports the pipeline already organizes. UP006,
# UP007 and UP045 spell the modern syntax the floor already runs.
# UP009, UP015, UP024 and UP033 are four trivial modernizations.
# F401 drops the imports nothing reads. RUF100 drops the `noqa`
# comments nothing needs. RUF023 sorts the slots. PIE790, PIE800
# and PIE808 drop three kinds of dead weight.
#
# Strings: `%` stays where it is. New code prefers f-strings, and a
# `%` a touch already rewrites may ride along, but there is no bulk
# migration: UP031 has no autofix, and its thousand sites are a
# manual, trap-laden rewrite (a tuple on the right of `%` formats
# its elements, an f-string its repr). UP031 and UP032 stay off for
# the same reason.
#
# FA100 is absent: on this floor it fires only where a rewrite needs
# the import, and its fix is unsafe, so the editor never applies it.
# The presence of the import is held per package by its own gate.
# TC001-TC003 are deferred: should a runtime reader ever need a
# name, that name keeps a runtime import through the
# `runtime-evaluated-*` exemptions, per symbol.
#
# This stands down the broader set that was here (E, W, the rest of
# F, C, T, Q and the rest of UP): one style for the collection, held
# by the gate below rather than by the editor alone.
#
# UP035 moves the typing names to `collections.abc`.
select = [
    "B035",
    "F401",
    "FURB116",
    "FURB122",
